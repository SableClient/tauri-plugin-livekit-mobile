name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Tauri's Linux target dependencies require GTK/GLib even without tauri/wry.
      - run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: cargo fmt --all --check
      - run: cargo test


  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Provide tauri-android project
        run: |
          git clone --depth 1 --branch tauri-v2.11.3 https://github.com/tauri-apps/tauri /tmp/tauri
          mkdir -p android/.tauri
          cp -r /tmp/tauri/crates/tauri/mobile/android android/.tauri/tauri-api
      - name: Test and compile Kotlin sources
        run: gradle -p android testDebugUnitTest assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Provide Tauri Swift package
        run: |
          git clone --depth 1 --branch tauri-v2.11.3 https://github.com/tauri-apps/tauri /tmp/tauri
          mkdir -p .tauri
          cp -r /tmp/tauri/crates/tauri/mobile/ios-api .tauri/tauri-api
      - name: Build Swift package for iOS
        run: |
          xcodebuild -scheme tauri-plugin-livekit-mobile \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
      # Exercises the build script that links the Swift package into a host app.
      # `swift build` alone never runs it. `wry` gates `register_ios_plugin`.
      - name: Link plugin into an iOS cargo build
        run: cargo build --target aarch64-apple-ios --features tauri/wry
